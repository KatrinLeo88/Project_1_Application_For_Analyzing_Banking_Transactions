[project]
name = "bank-analitic"
version = "0.1.0"
description = "This is an application for analyzing banking transactions"
authors = [
    {name = "Katrin",email = "245931351+KatrinLeo88@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas (>=2.3.3,<3.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
    "pandas-stubs (>=2.3.2.250926,<3.0.0.0)",
    "types-openpyxl (>=3.1.5.20250919,<4.0.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pytest (>=9.0.1,<10.0.0)",
    "coverage (>=7.12.0,<8.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "mypy (>=1.19.0,<2.0.0)"
]

[tool.poetry.group.dev.dependencies]
pytest-cov = "^7.0.0"

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119
profile = "black"

[tool.coverage.run]
omit = ["src/main.py"]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = "venv"